  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

1B; border:1px solid rgba(255,255,255,0.06); border-radius:24px; padding:32px; display:flex; flex-direction:column; position:relative; overflow:hidden;\">\n        <div style=\"display:flex; align-items:flex-start; justify-content:space-between;\">\n          <div style=\"font-family:'Cabinet Grotesk','Space Grotesk',sans-serif; font-weight:600; font-size:22px; color:#FAFAF9;\">Card Recommender<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ toggleQuizState }}\" style=\"background:transparent; border:1px solid rgba(255,255,255,0.12); color:#71717A; font-family:'Lexend Deca',sans-serif; font-size:11px; padding:6px 10px; border-radius:20px; cursor:pointer;\" style-hover=\"border-color:rgba(255,255,255,0.3); color:#A1A1AA;\">Preview: {{ quizToggleLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ !quizTaken }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex; flex:1; align-items:center; gap:32px; margin-top:12px;\">\n            <div style=\"flex:1; display:flex; flex-direction:column; gap:16px;\">\n              <div style=\"font-family:'Cabinet Grotesk','Space Grotesk',sans-serif; font-weight:600; font-size:26px; line-height:1.2; color:#FAFAF9;\">Find your perfect card in 2 minutes<\u002Fdiv>\n              <div style=\"font-size:15px; color:#A1A1AA; line-height:1.5; max-width:380px;\">Answer a few quick questions about how you spend and MIMIR will match you with the cards worth having.<\u002Fdiv>\n              <button sc-camel-on-click=\"{{ openQuiz }}\" style=\"margin-top:8px; width:fit-content; background:#E5B567; color:#161611; border:none; font-family:'Lexend Deca',sans-serif; font-weight:600; font-size:15px; padding:14px 26px; border-radius:14px; cursor:pointer;\" style-hover=\"background:#F0C685;\">Take the quiz<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"width:180px; height:220px; border-radius:16px; background:repeating-linear-gradient(135deg, rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 8px, rgba(255,255,255,0.02) 8px, rgba(255,255,255,0.02) 16px); border:1px solid rgba(255,255,255,0.08); display:flex; align-items:center; justify-content:center; flex-shrink:0;\">\n              <div style=\"font-family:monospace; font-size:11px; color:#52525B; text-align:center; padding:0 16px;\">card illustration<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ quizTaken }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex; flex:1; align-items:center; gap:28px; margin-top:12px;\">\n            <div style=\"width:150px; height:96px; border-radius:14px; background:linear-gradient(135deg,#2B2416,#4A3A1C); border:1px solid rgba(229,181,103,0.3); flex-shrink:0; padding:14px; display:flex; flex-direction:column; justify-content:space-between;\">\n              <div style=\"width:26px; height:20px; background:rgba(229,181,103,0.5); border-radius:4px;\"><\u002Fdiv>\n              <div style=\"font-family:'Lexend Deca',sans-serif; font-size:12px; color:#E5B567; letter-spacing:1px;\">•••• 4471<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"flex:1; display:flex; flex-direction:column; gap:10px;\">\n              <div style=\"font-size:11px; text-transform:uppercase; letter-spacing:1px; color:#00A1FF; font-weight:600;\">Top pick from MIMIR<\u002Fdiv>\n              <div style=\"font-family:'Cabinet Grotesk','Space Grotesk',sans-serif; font-weight:600; font-size:20px; color:#FAFAF9;\">Horizon Rewards Platinum<\u002Fdiv>\n              <div style=\"font-size:14px; color:#A1A1AA; line-height:1.5;\">\"You spend heavily on travel and dining — this card's 3x multiplier on both beats what you're carrying now.\"<\u002Fdiv>\n              <button sc-camel-on-click=\"{{ openResults }}\" style=\"margin-top:6px; width:fit-content; background:transparent; color:#00A1FF; border:none; font-family:'Lexend Deca',sans-serif; font-weight:600; font-size:14px; padding:0; cursor:pointer;\" style-hover=\"text-decoration:underline;\">See all recommendations →<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <!-- Card Arsenal -->\n      <div style=\"grid-column:8 / 13; grid-row:1 / 3; background:#18181B; border:1px solid rgba(255,255,255,0.06); border-radius:24px; padding:28px 28px; display:flex; flex-direction:column;\">\n        <div style=\"display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;\">\n          <div style=\"display:flex; flex-direction:column; gap:2px;\">\n            <div style=\"font-family:'Cabinet Grotesk','Space Grotesk',sans-serif; font-weight:600; font-size:20px; color:#FAFAF9;\">Your Card Arsenal<\u002Fdiv>\n            <div style=\"font-size:13px; color:#71717A;\">{{ arsenalCountLabel }}<\u002Fdiv>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ toggleArsenalState }}\" style=\"background:transparent; border:1px solid rgba(255,255,255,0.12); color:#71717A; font-family:'Lexend Deca',sans-serif; font-size:11px; padding:6px 10px; border-radius:20px; cursor:pointer; flex-shrink:0;\" style-hover=\"border-color:rgba(255,255,255,0.3); color:#A1A1AA;\">Preview: {{ arsenalToggleLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ !arsenalHasCards }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"flex:1; border:1px dashed rgba(255,255,255,0.14); border-radius:16px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:20px;\">\n            <div style=\"font-size:14px; color:#71717A;\">No cards added yet<\u002Fdiv>\n            <button style=\"background:transparent; color:#E5B567; border:1px solid rgba(229,181,103,0.4); font-family:'Lexend Deca',sans-serif; font-weight:600; font-size:13px; padding:9px 18px; border-radius:12px; cursor:pointer;\" style-hover=\"background:rgba(229,181,103,0.08);\">Add your first card<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ arsenalHasCards }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"flex:1; display:grid; grid-template-columns:repeat(2,1fr); gap:14px; overflow-y:auto; align-content:start; padding-right:4px;\">\n            <sc-for list=\"{{ arsenalCards }}\" as=\"card\" hint-placeholder-count=\"4\">\n              <div style=\"width:100%; height:88px; border-radius:12px; padding:12px; display:flex; flex-direction:column; justify-content:space-between; background:{{ card.bg }}; border:1px solid {{ card.border }};\">\n                <div style=\"display:flex; align-items:center; justify-content:space-between;\">\n                  <div style=\"width:22px; height:16px; background:rgba(255,255,255,0.35); border-radius:3px;\"><\u002Fdiv>\n                  <div style=\"font-size:9px; letter-spacing:0.5px; color:rgba(255,255,255,0.6); font-family:'Lexend Deca',sans-serif;\">{{ card.network }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div>\n                  <div style=\"font-size:11px; color:rgba(255,255,255,0.85); font-family:'Lexend Deca',sans-serif; font-weight:500;\">{{ card.name }}<\u002Fdiv>\n                  <div style=\"font-size:10px; color:rgba(255,255,255,0.5); letter-spacing:1px; margin-top:2px;\">•••• {{ card.last4 }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <!-- Ask MIMIR -->\n      <div sc-camel-on-click=\"{{ openDrawer }}\" style=\"grid-column:1 / 8; grid-row:2; background:#18181B; border:1px solid rgba(255,255,255,0.06); border-radius:24px; padding:20px 28px; display:flex; align-items:center; gap:20px; cursor:pointer; transition:border-color 0.2s;\" style-hover=\"border-color:rgba(229,181,103,0.35);\">\n        <div style=\"width:44px; height:44px; flex-shrink:0;\">\n          <svg sc-camel-view-box=\"0 0 52 52\" width=\"100%\" height=\"100%\" fill=\"none\">\n            <circle cx=\"26\" cy=\"26\" r=\"24.5\" stroke=\"#E5B567\" stroke-width=\"1.2\" opacity=\"0.35\"><\u002Fcircle>\n            <path d=\"M10 26C14 18 20 15 26 15C32 15 38 18 42 26C38 34 32 37 26 37C20 37 14 34 10 26Z\" stroke=\"#E5B567\" stroke-width=\"1.4\"><\u002Fpath>\n            <circle cx=\"26\" cy=\"26\" r=\"6\" stroke=\"#00A1FF\" stroke-width=\"1.4\"><\u002Fcircle>\n            <circle cx=\"26\" cy=\"26\" r=\"1.8\" fill=\"#00A1FF\"><\u002Fcircle>\n            <path d=\"M6 20C3 16 3 10 6 6\" stroke=\"#E5B567\" stroke-width=\"1.1\" stroke-linecap=\"round\" opacity=\"0.7\"><\u002Fpath>\n            <path d=\"M6 32C2 36 2 42 6 46\" stroke=\"#E5B567\" stroke-width=\"1.1\" stroke-linecap=\"round\" opacity=\"0.7\"><\u002Fpath>\n            <path d=\"M46 20C49 16 49 10 46 6\" stroke=\"#E5B567\" stroke-width=\"1.1\" stroke-linecap=\"round\" opacity=\"0.7\"><\u002Fpath>\n            <path d=\"M46 32C50 36 50 42 46 46\" stroke=\"#E5B567\" stroke-width=\"1.1\" stroke-linecap=\"round\" opacity=\"0.7\"><\u002Fpath>\n          <\u002Fsvg>\n        <\u002Fdiv>\n        <div style=\"flex-shrink:0;\">\n          <div style=\"font-family:'Cabinet Grotesk','Space Grotesk',sans-serif; font-weight:600; font-size:17px; color:#FAFAF9;\">Ask MIMIR anything<\u002Fdiv>\n          <div style=\"font-size:12px; color:#A1A1AA; margin-top:2px;\">Rewards math, comparisons, strategy<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1; background:#0F0F11; border:1px solid rgba(255,255,255,0.08); border-radius:14px; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; min-width:0;\">\n          <span style=\"font-size:14px; color:#6B6B72; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;\">\"How should I pay for this trip?\"<\u002Fspan>\n          <div style=\"width:26px; height:26px; border-radius:8px; background:#00A1FF; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-left:12px;\">\n            <div style=\"width:0; height:0; border-top:5px solid transparent; border-bottom:5px solid transparent; border-left:7px solid #06131A; margin-left:2px;\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Feature 3: Goal-Based Advisor -->\n      <div style=\"grid-column:1 / 9; grid-row:3; background:#18181B; border:1px solid rgba(255,255,255,0.06); border-radius:24px; padding:28px 32px; display:flex; flex-direction:column; justify-content:center; gap:10px; position:relative;\">\n        <div style=\"position:absolute; top:24px; right:28px; background:rgba(255,255,255,0.06); color:#A1A1AA; font-family:'Lexend Deca',sans-serif; font-size:11px; font-weight:600; letter-spacing:0.5px; padding:6px 12px; border-radius:20px;\">COMING SOON<\u002Fdiv>\n        <div style=\"font-family:'Cabinet Grotesk','Space Grotesk',sans-serif; font-weight:600; font-size:20px; color:#FAFAF9;\">Goal-Based Advisor<\u002Fdiv>\n        <div style=\"font-size:14px; color:#A1A1AA; line-height:1.5; max-width:520px;\">State a goal — \"best card for a $3,000 TV\" — and get one clear, confident answer instead of ten open tabs.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Chrome Extension -->\n      <div style=\"grid-column:9 / 13; grid-row:3; background:#18181B; border:1px solid rgba(255,255,255,0.06); border-radius:24px; padding:24px 26px; display:flex; flex-direction:column; justify-content:center; gap:8px; position:relative;\">\n        <div style=\"position:absolute; top:22px; right:22px; background:rgba(255,255,255,0.06); color:#A1A1AA; font-family:'Lexend Deca',sans-serif; font-size:10px; font-weight:600; letter-spacing:0.5px; padding:5px 10px; border-radius:20px;\">SOON<\u002Fdiv>\n        <div style=\"font-family:'Cabinet Grotesk','Space Grotesk',sans-serif; font-weight:600; font-size:17px; color:#FAFAF9;\">MIMIR for Chrome<\u002Fdiv>\n        <div style=\"font-size:13px; color:#A1A1AA; line-height:1.45;\">MIMIR watches for better offers while you shop, wherever you are.<\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- Drawer backdrop + panel -->\n<sc-if value=\"{{ drawerOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div sc-camel-on-click=\"{{ closeDrawer }}\" style=\"position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:40; animation:fadeIn 0.2s ease;\"><\u002Fdiv>\n  <div style=\"position:fixed; top:0; right:0; bottom:0; width:420px; max-width:92vw; background:#18181B; border-left:1px solid rgba(255,255,255,0.08); z-index:41; display:flex; flex-direction:column; animation:slideIn 0.25s ease;\">\n    <div style=\"display:flex; align-items:center; justify-content:space-between; padding:22px 24px; border-bottom:1px solid rgba(255,255,255,0.07);\">\n      <div style=\"display:flex; align-items:center; gap:12px;\">\n        <div style=\"width:34px; height:34px;\">\n          <svg sc-camel-view-box=\"0 0 52 52\" width=\"100%\" height=\"100%\" fill=\"none\">\n            <circle cx=\"26\" cy=\"26\" r=\"24.5\" stroke=\"#E5B567\" stroke-width=\"1.2\" opacity=\"0.35\"><\u002Fcircle>\n            <path d=\"M10 26C14 18 20 15 26 15C32 15 38 18 42 26C38 34 32 37 26 37C20 37 14 34 10 26Z\" stroke=\"#E5B567\" stroke-width=\"1.4\"><\u002Fpath>\n            <circle cx=\"26\" cy=\"26\" r=\"6\" stroke=\"#00A1FF\" stroke-width=\"1.4\"><\u002Fcircle>\n            <circle cx=\"26\" cy=\"26\" r=\"1.8\" fill=\"#00A1FF\"><\u002Fcircle>\n            <path d=\"M6 20C3 16 3 10 6 6\" stroke=\"#E5B567\" stroke-width=\"1.1\" stroke-linecap=\"round\" opacity=\"0.7\"><\u002Fpath>\n            <path d=\"M6 32C2 36 2 42 6 46\" stroke=\"#E5B567\" stroke-width=\"1.1\" stroke-linecap=\"round\" opacity=\"0.7\"><\u002Fpath>\n            <path d=\"M46 20C49 16 49 10 46 6\" stroke=\"#E5B567\" stroke-width=\"1.1\" stroke-linecap=\"round\" opacity=\"0.7\"><\u002Fpath>\n            <path d=\"M46 32C50 36 50 42 46 46\" stroke=\"#E5B567\" stroke-width=\"1.1\" stroke-linecap=\"round\" opacity=\"0.7\"><\u002Fpath>\n          <\u002Fsvg>\n        <\u002Fdiv>\n        <div style=\"font-family:'Cabinet Grotesk','Space Grotesk',sans-serif; font-weight:600; font-size:17px; color:#FAFAF9;\">MIMIR<\u002Fdiv>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ closeDrawer }}\" style=\"background:transparent; border:none; color:#71717A; font-size:22px; cursor:pointer; line-height:1;\" style-hover=\"color:#FAFAF9;\">×<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"flex:1; padding:24px; overflow-y:auto; display:flex; flex-direction:column; gap:14px;\">\n      <div style=\"align-self:flex-start; max-width:85%; background:#0F0F11; border:1px solid rgba(255,255,255,0.07); border-radius:14px; border-top-left-radius:4px; padding:12px 16px; font-size:14px; color:#D4D4D8; line-height:1.5;\">Hi, I'm MIMIR. Ask me anything about your cards, rewards, or which one to use next.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:20px 24px; border-top:1px solid rgba(255,255,255,0.07);\">\n      <div style=\"background:#0F0F11; border:1px solid rgba(255,255,255,0.1); border-radius:14px; padding:14px 16px; display:flex; align-items:center; justify-content:space-between;\">\n        <span style=\"font-size:14px; color:#6B6B72;\">Type your question...<\u002Fspan>\n        <div style=\"width:30px; height:30px; border-radius:8px; background:#00A1FF; display:flex; align-items:center; justify-content:center; flex-shrink:0;\">\n          <div style=\"width:0; height:0; border-top:5px solid transparent; border-bottom:5px solid transparent; border-left:7px solid #06131A; margin-left:2px;\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- Quiz modal -->\n<sc-if value=\"{{ quizOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div sc-camel-on-click=\"{{ closeQuiz }}\" style=\"position:fixed; inset:0; background:rgba(0,0,0,0.65); z-index:40; display:flex; align-items:center; justify-content:center; animation:fadeIn 0.2s ease;\">\n    <div sc-camel-on-click=\"{{ stopClick }}\" style=\"width:520px; max-width:90vw; background:#18181B; border:1px solid rgba(255,255,255,0.09); border-radius:22px; padding:36px; animation:popIn 0.2s ease;\">\n      <div style=\"display:flex; align-items:center; justify-content:space-between; margin-bottom:24px;\">\n        <div style=\"font-family:'Cabinet Grotesk','Space Grotesk',sans-serif; font-weight:600; font-size:20px; color:#FAFAF9;\">Card Recommender Quiz<\u002Fdiv>\n        <button sc-camel-on-click=\"{{ closeQuiz }}\" style=\"background:transparent; border:none; color:#71717A; font-size:22px; cursor:pointer;\" style-hover=\"color:#FAFAF9;\">×<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"font-size:12px; color:#00A1FF; font-weight:600; letter-spacing:0.5px; margin-bottom:12px;\">QUESTION 1 OF 5<\u002Fdiv>\n      <div style=\"font-family:'Cabinet Grotesk','Space Grotesk',sans-serif; font-weight:600; font-size:19px; color:#FAFAF9; margin-bottom:20px;\">Where does most of your spending go?<\u002Fdiv>\n      <div style=\"display:flex; flex-direction:column; gap:10px;\">\n        <div style=\"border:1px solid rgba(255,255,255,0.1); border-radius:12px; padding:14px 16px; font-size:14px; color:#D4D4D8; cursor:pointer;\" style-hover=\"border-color:#E5B567;\">Travel &amp; dining<\u002Fdiv>\n        <div style=\"border:1px solid rgba(255,255,255,0.1); border-radius:12px; padding:14px 16px; font-size:14px; color:#D4D4D8; cursor:pointer;\" style-hover=\"border-color:#E5B567;\">Groceries &amp; everyday<\u002Fdiv>\n        <div style=\"border:1px solid rgba(255,255,255,0.1); border-radius:12px; padding:14px 16px; font-size:14px; color:#D4D4D8; cursor:pointer;\" style-hover=\"border-color:#E5B567;\">Online shopping<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- Results overlay -->\n<sc-if value=\"{{ resultsOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed; inset:0; background:#000000; z-index:40; overflow-y:auto; animation:fadeIn 0.2s ease;\">\n    <div style=\"max-width:900px; margin:0 auto; padding:56px 40px;\">\n      <div style=\"display:flex; align-items:center; justify-content:space-between; margin-bottom:36px;\">\n        <div style=\"font-family:'Cabinet Grotesk','Space Grotesk',sans-serif; font-weight:700; font-size:30px; color:#FAFAF9;\">Your recommendations<\u002Fdiv>\n        <button sc-camel-on-click=\"{{ closeResults }}\" style=\"background:transparent; border:1px solid rgba(255,255,255,0.15); color:#D4D4D8; font-family:'Lexend Deca',sans-serif; font-size:13px; padding:9px 16px; border-radius:12px; cursor:pointer;\" style-hover=\"border-color:#FAFAF9;\">Close<\u002Fbutton>\n      <\u002Fdiv>\n      <sc-for list=\"{{ recommendations }}\" as=\"rec\" hint-placeholder-count=\"3\">\n        <div style=\"display:flex; gap:24px; align-items:center; background:#18181B; border:1px solid rgba(255,255,255,0.06); border-radius:20px; padding:24px; margin-bottom:16px;\">\n          <div style=\"width:150px; height:96px; border-radius:14px; flex-shrink:0; background:{{ rec.bg }}; border:1px solid {{ rec.border }}; padding:14px; display:flex; flex-direction:column; justify-content:space-between;\">\n            <div style=\"width:26px; height:20px; background:rgba(255,255,255,0.4); border-radius:4px;\"><\u002Fdiv>\n            <div style=\"font-family:'Lexend Deca',sans-serif; font-size:11px; color:rgba(255,255,255,0.8); letter-spacing:1px;\">•••• {{ rec.last4 }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:1;\">\n            <div style=\"font-size:11px; text-transform:uppercase; letter-spacing:1px; color:#00A1FF; font-weight:600; margin-bottom:6px;\">{{ rec.rank }}<\u002Fdiv>\n            <div style=\"font-family:'Cabinet Grotesk','Space Grotesk',sans-serif; font-weight:600; font-size:19px; color:#FAFAF9; margin-bottom:6px;\">{{ rec.name }}<\u002Fdiv>\n            <div style=\"font-size:14px; color:#A1A1AA; line-height:1.5;\">{{ rec.reason }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    quizTaken: false,\n    arsenalHasCards: false,\n    drawerOpen: false,\n    quizOpen: false,\n    resultsOpen: false\n  };\n\n  renderVals() {\n    const now = new Date();\n    const hour = now.getHours();\n    const period = hour < 12 ? 'morning' : hour < 18 ? 'afternoon' : 'evening';\n    const name = 'Jordan';\n    const dateString = now.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });\n\n    const arsenalCards = [\n      { name: 'Horizon Platinum', last4: '4471', network: 'VISA', bg: 'linear-gradient(135deg,#2B2416,#4A3A1C)', border: 'rgba(229,181,103,0.3)' },\n      { name: 'Everyday Cashback', last4: '2210', network: 'MC', bg: 'linear-gradient(135deg,#0F1E2B,#123449)', border: 'rgba(0,161,255,0.3)' },\n      { name: 'Voyage Elite', last4: '9083', network: 'AMEX', bg: 'linear-gradient(135deg,#1C1C1F,#2E2E33)', border: 'rgba(255,255,255,0.15)' },\n      { name: 'Student Basics', last4: '5527', network: 'VISA', bg: 'linear-gradient(135deg,#1A2419,#243A20)', border: 'rgba(120,200,120,0.25)' }\n    ];\n\n    const recommendations = [\n      { rank: '#1 Top pick', name: 'Horizon Rewards Platinum', reason: 'You spend heavily on travel and dining — this card\\'s 3x multiplier on both beats what you\\'re carrying now.', last4: '4471', bg: 'linear-gradient(135deg,#2B2416,#4A3A1C)', border: 'rgba(229,181,103,0.3)' },\n      { rank: '#2 Runner-up', name: 'Everyday Cashback Plus', reason: 'Strong flat-rate cashback if you\\'d rather not track bonus categories.', last4: '2210', bg: 'linear-gradient(135deg,#0F1E2B,#123449)', border: 'rgba(0,161,255,0.3)' },\n      { rank: '#3 Worth a look', name: 'Voyage Elite', reason: 'Best-in-class airport lounge access, though the annual fee is steeper.', last4: '9083', bg: 'linear-gradient(135deg,#1C1C1F,#2E2E33)', border: 'rgba(255,255,255,0.15)' }\n    ];\n\n    return {\n      greeting: `Good ${period}, ${name}`,\n      dateString,\n      quizTaken: this.state.quizTaken,\n      quizToggleLabel: this.state.quizTaken ? 'taken' : 'not taken',\n      toggleQuizState: () => this.setState(s => ({ quizTaken: !s.quizTaken })),\n      arsenalHasCards: this.state.arsenalHasCards,\n      arsenalToggleLabel: this.state.arsenalHasCards ? 'has cards' : 'empty',\n      arsenalCountLabel: this.state.arsenalHasCards ? `${arsenalCards.length} cards` : 'No cards yet',\n      toggleArsenalState: () => this.setState(s => ({ arsenalHasCards: !s.arsenalHasCards })),\n      arsenalCards,\n      recommendations,\n      drawerOpen: this.state.drawerOpen,\n      openDrawer: () => this.setState({ drawerOpen: true }),\n      closeDrawer: () => this.setState({ drawerOpen: false }),\n      quizOpen: this.state.quizOpen,\n      openQuiz: () => this.setState({ quizOpen: true }),\n      closeQuiz: () => this.setState({ quizOpen: false }),\n      resultsOpen: this.state.resultsOpen,\n      openResults: () => this.setState({ resultsOpen: true }),\n      closeResults: () => this.setState({ resultsOpen: false }),\n      stopClick: (e) => e.stopPropagation()\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
